function group(date){let g=db.groups.find(x=>x.date===date);if(!g){g={date,serial:Math.max(0,...db.groups.map(x=>x.serial||0))+1,next:1};db.groups.push(g)}return g}

// Keep the active cell above the iPhone keyboard and preserve the cursor location.
let activeCell=null,focusTimers=[];
function keepActiveCellVisible(){if(!activeCell||!activeCell.isConnected)return;const vv=window.visualViewport;const bottom=vv?(vv.offsetTop+vv.height):window.innerHeight;const rect=activeCell.getBoundingClientRect();const safeBottom=bottom-18;if(rect.bottom>safeBottom){window.scrollBy({top:rect.bottom-safeBottom+8,left:0,behavior:'smooth'})}else if(rect.top<12){window.scrollBy({top:rect.top-12,left:0,behavior:'smooth'})}}
