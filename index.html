$('backup').onclick=()=>{const payload={app:'daily-ledger',version:1,exportedAt:new Date().toISOString(),groups:db.groups,rows:db.rows,nextId:db.nextId};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='daily-ledger-backup-'+today()+'.json';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};$('allClear').onclick=()=>{let msg=lang==='bn'?'সতর্কতা: সব দিনের সব লেনদেন স্থায়ীভাবে মুছে যাবে। আগে ব্যাকআপ নিয়েছেন কি? আপনি কি নিশ্চিত?':'Warning: All transactions for every date will be permanently deleted. Have you made a backup? Are you sure?';if(!confirm(msg))return;db={groups:[],rows:[],nextId:1};dateFilter='';monthFilter='';$('dateFilter').value='';$('monthFilter').value='';save();render()};$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.groups)||!Array.isArray(x.rows))throw 0;if(confirm(T[lang].backupReplace)){db=x;db.nextId=db.nextId||Math.max(0,...db.rows.map(r=>r.id||0))+1;db.rows.forEach(r=>{if(r.mobile===undefined)r.mobile=r.option||''});save();render();alert(T[lang].restored)}}catch(_){alert(T[lang].badBackup)}e.target.value=''};$('print').onclick=()=>window.print();load();applyLanguage();
})();
</script></body></html>
