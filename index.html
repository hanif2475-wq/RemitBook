<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17496b"><title>দৈনিক লেনদেন শিট</title>

<style>

nput,td select{width:100%;height:40px;min-height:40px;border:0;border-radius:0;background:transparent;padding:4px 5px;font-size:16px;font-family:inherit;color:#17212b;outline-offset:-2px}td input:focus,td select:focus{outline:2px solid #2684c7;background:#f4fbff}td input[type=number]{text-align:right;font-variant-numeric:tabular-nums}td.serial,td.txn{background:#f3f6f8;color:#344f63;font-weight:700}tr.group-start td{border-top:2px solid #5e829b}td.actions{width:55px}td.actions button{padding:3px 6px;color:#a32323;border:0;background:transparent}.addbar{display:flex;justify-content:center;padding:12px 8px 76px}.addbar button{border-radius:30px;padding:10px 22px;font-size:15px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#f6f8fa;border-top:1px solid #cbd5df;padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;gap:7px;justify-content:center;flex-wrap:wrap;z-index:5}.bottom button,.bottom .filebtn{font-size:12px;padding:7px 9px}.empty{padding:20px;text-align:center;color:#667788;font-size:13px}.hint{font-size:10px;color:#657585;padding:5px 10px}.language{min-width:90px;height:38px;border:1px solid #b9c6d1;border-radius:4px;background:white;padding:4px 7px;font-size:16px}.resize-help{font-size:10px;color:#667788;padding:4px 10px;background:#fbfcfd;border-bottom:1px solid #e1e7ec}@media(max-width:768px){input,select,textarea{font-size:16px!important}button,.filebtn{min-height:38px;touch-action:manipulation}}.hidden{display:none!important}@media print{.toolbar,.bottom,.addbar button,td.actions,th.actions,.resize-help{display:none!important}header{background:#fff;color:#000;border-bottom:1px solid #888}.sheetwrap{overflow:visible}table{min-width:0;font-size:8px}td input,td select{font-size:8px!important;height:auto;min-height:0}th,td{height:auto;padding:2px}}
</style></head><body>
<header><div class="brand"><svg class="appicon" viewBox="0 0 100 100" aria-hidden="true"><rect x="5" y="5" width="90" height="90" rx="18" fill="#eaf3f8"/><path d="M24 16h38l15 15v53H24z" fill="#fff" stroke="#1769aa" stroke-width="4"/><path d="M62 16v17h15M35 47h34M35 59h34M35 71h23" stroke="#1769aa" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="72" cy="76" r="13" fill="#20a36b"/><path d="M72 68v16M64 76h16" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><div><h1 data-i18n="title">দৈনিক লেনদেন হিসাব</h1><small data-i18n="subtitle">Excel Sheet-এর মতো সরাসরি টেবিলে হিসাব লিখুন</small></div></div><div style="display:flex;align-items:center;gap:8px"><small data-i18n="currencyNote">QAR ও BDT আলাদা</small><select id="language" class="language" aria-label="Language"><option value="bn">বাংলা</option><option value="en">English</option></select></div></header>
<div class="toolbar"><label class="field"><span data-i18n="newDate">নতুন লেনদেনের তারিখ</span><input id="workDate" type="date"></label><button class="primary" id="addTop" data-i18n="addThis">＋ এই তারিখে সারি যোগ</button><label class="field"><span data-i18n="findDate">তারিখ খুঁজুন</span><input id="dateFilter" type="date"></label><label class="field"><span data-i18n="monthReport">মাসের হিসাব</span><input id="monthFilter" type="month"></label><button id="showAll" data-i18n="allDates">সব তারিখ</button></div>
<div class="summary" id="summary"></div><div class="report" id="report"></div><div class="resize-help" data-i18n="resizeHelp">যেকোনো কলামের ডান পাশের ছোট দাগ ধরে টানলে ঘর বড়/ছোট হবে। সেটিংস সেভ থাকবে।</div>
<div class="sheetwrap"><table id="sheet"><colgroup id="cols"></colgroup><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
<div class="addbar"><button class="primary" id="addBottom" data-i18n="addRow">＋ নতুন লেনদেন যোগ করুন</button></div><div class="hint" data-i18n="hint">একই তারিখের নতুন লেনদেন যোগ করতে তারিখ নির্বাচন করে ＋ চাপুন। তারিখের ক্রমিক ও লেনদেন নম্বর স্থায়ী থাকবে।</div>
<div class="bottom"><button id="backup" data-i18n="backup">JSON ব্যাকআপ</button><label class="filebtn"><span data-i18n="restore">ব্যাকআপ ফিরিয়ে আনুন</span><input id="restore" type="file" accept=".json,application/json" class="hidden"></label><button id="print" data-i18n="print">প্রিন্ট / PDF</button></div>
<script>
(()=>{
const KEY='dailyLedger_excel_v1',WIDTHKEY='dailyLedger_columnWidths_v1',LANGKEY='dailyLedger_language_v1';let db={groups:[],rows:[],nextId:1};let dateFilter='',monthFilter='';let lang=localStorage.getItem(LANGKEY)||'bn';
const $=id=>document.getElementById(id),today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},n=v=>Number.isFinite(Number(v))?Number(v):0,fmt=v=>n(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={bn:{title:'দৈনিক লেনদেন হিসাব',subtitle:'Excel Sheet-এর মতো সরাসরি টেবিলে হিসাব লিখুন',currencyNote:'QAR ও BDT আলাদা',newDate:'নতুন লেনদেনের তারিখ',addThis:'＋ এই তারিখে সারি যোগ',findDate:'তারিখ খুঁজুন',monthReport:'মাসের হিসাব',allDates:'সব তারিখ',resizeHelp:'যেকোনো কলামের ডান পাশের ছোট দাগ ধরে টানলে ঘর বড়/ছোট হবে। সেটিংস সেভ থাকবে।',addRow:'＋ নতুন লেনদেন যোগ করুন',hint:'একই তারিখের নতুন লেনদেন যোগ করতে তারিখ নির্বাচন করে ＋ চাপুন। তারিখের ক্রমিক ও লেনদেন নম্বর স্থায়ী থাকবে।',backup:'JSON ব্যাকআপ',restore:'ব্যাকআপ ফিরিয়ে আনুন',print:'প্রিন্ট / PDF',headers:['তারিখ ক্রমিক','লেনদেন নং','তারিখ','লেনদেনের ধরন','মোবাইল নাম্বার','টাকার পরিমাণ (QAR)','টাকার পরিমাণ (BDT)','নাম','নগদ / বাকি','রেফারেন্স','নোট','আদায় (QAR)','মুছুন'],empty:'এখনো কোনো লেনদেন নেই। নিচের ＋ বাটনে চাপ দিয়ে শুরু করুন।',transactions:'লেনদেন',total:'মোট',collected:'আদায়',due:'বাকি',cash:'নগদ',creditRows:'বাকি লেনদেন',channel:'মাধ্যমভিত্তিক',deleteConfirm:'এই লেনদেন মুছে ফেলবেন?',chooseDate:'তারিখ নির্বাচন করুন',backupReplace:'বর্তমান ডেটার বদলে ব্যাকআপ বসবে। চালাবেন?',restored:'ব্যাকআপ ফিরিয়ে আনা হয়েছে',badBackup:'ব্যাকআপ ফাইলটি সঠিক নয়',channels:['বিকাশ','নগদ','ব্যাংক','ফ্লেক্সিলোড'],statuses:['নগদ','বাকি']},en:{title:'Daily Transaction Ledger',subtitle:'Enter transactions directly in an Excel-style sheet',currencyNote:'QAR and BDT are separate',newDate:'Date for new transaction',addThis:'＋ Add row to this date',findDate:'Find date',monthReport:'Monthly report',allDates:'All dates',resizeHelp:'Drag the small handle at the right edge of any column to widen or narrow it. Widths are saved.',addRow:'＋ Add new transaction',hint:'Choose a date and press ＋ to add another transaction for that date. Date serials and transaction numbers remain fixed.',backup:'JSON Backup',restore:'Restore Backup',print:'Print / PDF',headers:['Date serial','Transaction no.','Date','Transaction type','Mobile number','Amount (QAR)','Amount (BDT)','Name','Cash / Credit','Reference','Note','Collected (QAR)','Delete'],empty:'No transactions yet. Press the ＋ button below to start.',transactions:'Transactions',total:'Total',collected:'Collected',due:'Outstanding',cash:'Cash',creditRows:'Credit transactions',channel:'By channel',deleteConfirm:'Delete this transaction?',chooseDate:'Please choose a date',backupReplace:'The backup will replace current data. Continue?',restored:'Backup restored',badBackup:'Invalid backup file',channels:['bKash','Cash','Bank','Flexiload'],statuses:['Cash','Credit']}};
const tr=v=>{if(lang==='bn')return v;const m={'বিকাশ':'bKash','নগদ':'Cash','ব্যাংক':'Bank','ফ্লেক্সিলোড':'Flexiload','বাকি':'Credit'};return m[v]||v};
let widths=[68,78,116,128,190,132,140,150,108,135,180,128,65];try{let w=JSON.parse(localStorage.getItem(WIDTHKEY)||'null');if(Array.isArray(w)&&w.length===widths.length)widths=w.map((x,i)=>Math.max(55,Math.min(500,Number(x)||widths[i])))}catch(e){}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.groups)&&Array.isArray(x.rows)){db=x;db.nextId=db.nextId||Math.max(0,...db.rows.map(r=>r.id||0))+1;db.rows.forEach(r=>{if(r.mobile===undefined)r.mobile=r.option||''})}}catch(e){alert('Saved data could not be read. Restore from a backup if available.')}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function group(date){let g=db.groups.find(x=>x.date===date);if(!g){g={date,serial:Math.max(0,...db.groups.map(x=>x.serial||0))+1,next:1};db.groups.push(g)}return g}
function addRow(date){if(!date){alert(T[lang].chooseDate);return}let g=group(date);let r={id:db.nextId++,date,txn:g.next++,type:'বিকাশ',mobile:'',option:'',qar:'',bdt:'',name:'',status:'নগদ',ref:'',note:'',collected:''};db.rows.push(r);save();dateFilter='';monthFilter='';$('dateFilter').value='';$('monthFilter').value='';render();let el=document.querySelector(`[data-id="${r.id}"][data-key="name"]`);if(el){el.focus();el.scrollIntoView({block:'nearest',inline:'center'})}}
function filtered(){return db.rows.filter(r=>(!dateFilter||r.date===dateFilter)&&(!monthFilter||r.date.startsWith(monthFilter))).sort((a,b)=>a.date.localeCompare(b.date)||a.txn-b.txn)}function sum(a,k){return a.reduce((s,r)=>s+n(r[k]),0)}
function field(r,k,opts){let attrs=`data-id="${r.id}" data-key="${k}"`;if(opts){return `<select ${attrs}>${opts.map(o=>`<option value="${esc(o)}" ${r[k]===o?'selected':''}>${esc(tr(o))}</option>`).join('')}</select>`}let type=['qar','bdt','collected'].includes(k)?'number':'text';let extra=k==='mobile'?'inputmode="tel" autocomplete="tel" placeholder="01825763000"':'';return `<input ${attrs} type="${type}" ${type==='number'?'min="0" step="0.01"':''} ${extra} value="${esc(r[k])}">`}
const colKeys=['serial','txn','date','type','mobile','qar','bdt','name','status','ref','note','collected','actions'];
function buildHeader(){let heads=T[lang].headers;$('head').innerHTML=heads.map((h,i)=>`<th data-col="${i}">${h}<span class="resize" data-resize="${i}" title="Resize column"></span></th>`).join('');$('cols').innerHTML=widths.map(w=>`<col style="width:${w}px">`).join('')}
function renderSummary(a){let q=sum(a,'qar'),b=sum(a,'bdt'),c=sum(a,'collected'),cash=a.filter(r=>r.status==='নগদ'),credit=a.filter(r=>r.status==='বাকি'),t=T[lang];$('summary').innerHTML=`<span>${t.transactions}: <b>${a.length}</b></span><span>${t.total}: <b>${fmt(q)} QAR</b></span><span>${t.total}: <b>${fmt(b)} BDT</b></span><span>${t.collected}: <b>${fmt(c)} QAR</b></span><span>${t.due}: <b>${fmt(Math.max(0,q-c))} QAR</b></span><span>${t.cash}: <b>${fmt(sum(cash,'qar'))} QAR</b></span><span>${t.creditRows}: <b>${fmt(sum(credit,'qar'))} QAR</b></span>`;let types=T[lang].channels,canonical=['বিকাশ','নগদ','ব্যাংক','ফ্লেক্সিলোড'];$('report').textContent=t.channel+': '+canonical.map((v,i)=>`${types[i]} ${fmt(sum(a.filter(r=>r.type===v),'qar'))} QAR / ${fmt(sum(a.filter(r=>r.type===v),'bdt'))} BDT`).join('  |  ')}
function render(){let a=filtered(),groups=new Map(db.groups.map(g=>[g.date,g]));buildHeader();$('rows').innerHTML=a.map((r,i)=>{let g=groups.get(r.date)||group(r.date),first=i===0||a[i-1].date!==r.date;return `<tr class="${first?'group-start':''}"><td class="serial">${first?g.serial:''}</td><td class="txn">${r.txn}</td><td>${esc(r.date)}</td><td>${field(r,'type',['বিকাশ','নগদ','ব্যাংক','ফ্লেক্সিলোড'])}</td><td>${field(r,'mobile')}</td><td>${field(r,'qar')}</td><td>${field(r,'bdt')}</td><td>${field(r,'name')}</td><td>${field(r,'status',['নগদ','বাকি'])}</td><td>${field(r,'ref')}</td><td>${field(r,'note')}</td><td>${field(r,'collected')}</td><td class="actions"><button data-del="${r.id}" title="${lang==='bn'?'মুছুন':'Delete'}">✕</button></td></tr>`}).join('')||`<tr><td colspan="13" class="empty">${T[lang].empty}</td></tr>`;renderSummary(a)}
function applyLanguage(){document.documentElement.lang=lang;$('language').value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{let k=el.dataset.i18n;el.textContent=T[lang][k]});render()}
$('language').value=lang;$('language').onchange=e=>{lang=e.target.value;localStorage.setItem(LANGKEY,lang);applyLanguage()};$('workDate').value=today();$('addTop').onclick=()=>addRow($('workDate').value);$('addBottom').onclick=()=>addRow($('workDate').value);$('dateFilter').onchange=e=>{dateFilter=e.target.value;monthFilter='';$('monthFilter').value='';render()};$('monthFilter').onchange=e=>{monthFilter=e.target.value;dateFilter='';$('dateFilter').value='';render()};$('showAll').onclick=()=>{dateFilter=monthFilter='';$('dateFilter').value='';$('monthFilter').value='';render()};
$('rows').addEventListener('change',e=>{let el=e.target,id=Number(el.dataset.id),k=el.dataset.key;if(!id||!k)return;let r=db.rows.find(x=>x.id===id);if(!r)return;r[k]=el.value;if(k==='mobile')r.option=el.value;save();renderSummary(filtered())});$('rows').addEventListener('click',e=>{let b=e.target.closest('[data-del]');if(b&&confirm(T[lang].deleteConfirm)){db.rows=db.rows.filter(r=>r.id!==Number(b.dataset.del));save();render()}});
// Drag a column edge to resize it; saved locally.
let drag=null;$('head').addEventListener('pointerdown',e=>{let h=e.target.closest('[data-resize]');if(!h)return;let i=Number(h.dataset.resize);drag={i,x:e.clientX,w:widths[i]};h.setPointerCapture?.(e.pointerId);e.preventDefault()});$('head').addEventListener('pointermove',e=>{if(!drag)return;let w=Math.max(55,Math.min(500,drag.w+(e.clientX-drag.x)));widths[drag.i]=w;$('cols').children[drag.i].style.width=w+'px'});$('head').addEventListener('pointerup',()=>{if(!drag)return;localStorage.setItem(WIDTHKEY,JSON.stringify(widths));drag=null});$('head').addEventListener('pointercancel',()=>{if(drag){localStorage.setItem(WIDTHKEY,JSON.stringify(widths));drag=null}});
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily-ledger-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.groups)||!Array.isArray(x.rows))throw 0;if(confirm(T[lang].backupReplace)){db=x;db.nextId=db.nextId||Math.max(0,...db.rows.map(r=>r.id||0))+1;db.rows.forEach(r=>{if(r.mobile===undefined)r.mobile=r.option||''});save();render();alert(T[lang].restored)}}catch(_){alert(T[lang].badBackup)}e.target.value=''};$('print').onclick=()=>window.print();load();applyLanguage();
})();
</script></body></html>
