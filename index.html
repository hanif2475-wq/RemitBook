function addRow(date){if(!date){alert(T[lang].chooseDate);return}let g=group(date);let r={id:db.nextId++,date,txn:g.next++,type:'বিকাশ',mobile:'',option:'',qar:'',bdt:'',name:'',status:'নগদ',ref:'',note:'',collected:''};db.rows.push(r);save();dateFilter='';monthFilter='';$('dateFilter').value='';$('monthFilter').value='';render();let el=document.querySelector(`[data-id="${r.id}"][data-key="name"]`);if(el){el.focus({preventScroll:true});activeCell=el;document.body.classList.add('keyboard-open');scheduleCellReveal(420)}}
function filtered(){return db.rows.filter(r=>(!dateFilter||r.date===dateFilter)&&(!monthFilter||r.date.startsWith(monthFilter))).sort((a,b)=>a.date.localeCompare(b.date)||a.txn-b.txn)}function sum(a,k){return a.reduce((s,r)=>s+n(r[k]),0)}
function field(r,k,opts){let attrs=`data-id="${r.id}" data-key="${k}"`;if(opts){return `<select ${attrs}>${opts.map(o=>`<option value="${esc(o)}" ${r[k]===o?'selected':''}>${esc(tr(o))}</option>`).join('')}</select>`}let type=['qar','bdt','collected'].includes(k)?'number':'text';let extra=k==='mobile'?'inputmode="tel" autocomplete="tel" placeholder="01825763000"':'';return `<input ${attrs} type="${type}" ${type==='number'?'min="0" step="0.01"':''} ${extra} value="${esc(r[k])}">`}
const colKeys=['serial','txn','date','type','mobile','qar','bdt','name','status','ref','note','collected','png','actions'];
function buildHeader(){let heads=T[lang].headers;$('head').innerHTML=heads.map((h,i)=>`<th data-col="${i}">${h}<span class="resize" data-resize="${i}" title="Resize column"></span></th>`).join('');$('cols').innerHTML=widths.map(w=>`<col style="width:${w}px">`).join('')}
function renderSummary(a){let q=sum(a,'qar'),b=sum(a,'bdt'),c=sum(a,'collected'),cash=a.filter(r=>r.status==='নগদ'),credit=a.filter(r=>r.status==='বাকি'),t=T[lang];$('summary').innerHTML=`<span>${t.transactions}: <b>${a.length}</b></span><span>${t.total}: <b>${fmt(q)} QAR</b></span><span>${t.total}: <b>${fmt(b)} BDT</b></span><span>${t.collected}: <b>${fmt(c)} QAR</b></span><span>${t.due}: <b>${fmt(Math.max(0,q-c))} QAR</b></span><span>${t.cash}: <b>${fmt(sum(cash,'qar'))} QAR</b></span><span>${t.creditRows}: <b>${fmt(sum(credit,'qar'))} QAR</b></span>`;let types=T[lang].channels,canonical=['বিকাশ','নগদ','ব্যাংক','ফ্লেক্সিলোড'];$('report').textContent=t.channel+': '+canonical.map((v,i)=>`${types[i]} ${fmt(sum(a.filter(r=>r.type===v),'qar'))} QAR / ${fmt(sum(a.filter(r=>r.type===v),'bdt'))} BDT`).join('  |  ')}
function render(){let a=filtered(),groups=new Map(db.groups.map(g=>[g.date,g]));buildHeader();$('rows').innerHTML=a.map((r,i)=>{let g=groups.get(r.date)||group(r.date),first=i===0||a[i-1].date!==r.date;return `<tr class="${first?'group-start':''}"><td class="serial">${first?g.serial:''}</td><td class="txn">${r.txn}</td><td>${esc(r.date)}</td><td>${field(r,'type',['বিকাশ','নগদ','ব্যাংক','ফ্লেক্সিলোড'])}</td><td>${field(r,'mobile')}</td><td>${field(r,'qar')}</td><td>${field(r,'bdt')}</td><td>${field(r,'name')}</td><td>${field(r,'status',['নগদ','বাকি'])}</td><td>${field(r,'ref')}</td><td>${field(r,'note')}</td><td>${field(r,'collected')}</td><td class="actions png-action"><button data-png="${r.id}" title="PNG কার্ড তৈরি করুন">PNG</button></td><td class="actions"><button data-del="${r.id}" title="${lang==='bn'?'মুছুন':'Delete'}">✕</button></td></tr>`}).join('')||`<tr><td colspan="14" class="empty">${T[lang].empty}</td></tr>`;renderSummary(a)}
function applyLanguage(){document.documentElement.lang=lang;$('language').value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{let k=el.dataset.i18n;el.textContent=T[lang][k]});render()}
$('language').value=lang;$('language').onchange=e=>{lang=e.target.value;localStorage.setItem(LANGKEY,lang);applyLanguage()};$('workDate').value=today();$('addTop').onclick=()=>addRow($('workDate').value);$('addBottom').onclick=()=>addRow($('workDate').value);$('dateFilter').onchange=e=>{dateFilter=e.target.value;monthFilter='';$('monthFilter').value='';render()};$('monthFilter').onchange=e=>{monthFilter=e.target.value;dateFilter='';$('dateFilter').value='';render()};$('showAll').onclick=()=>{dateFilter=monthFilter='';$('dateFilter').value='';$('monthFilter').value='';render()};
// Stable iPhone keyboard handling: avoid repeated smooth scrolling that makes the row jump.
let activeCell=null,revealTimer=null;
function revealActiveCell(){
  if(!activeCell||!activeCell.isConnected||document.activeElement!==activeCell)return;
  const vv=window.visualViewport;
  const visibleTop=vv?vv.offsetTop:0;
  const visibleBottom=vv?(vv.offsetTop+vv.height):window.innerHeight;
  const rect=activeCell.getBoundingClientRect();
  const marginTop=14,marginBottom=22;
  let delta=0;
  if(rect.bottom>visibleBottom-marginBottom) delta=rect.bottom-(visibleBottom-marginBottom);
  else if(rect.top<visibleTop+marginTop) delta=rect.top-(visibleTop+marginTop);
  if(Math.abs(delta)>2) window.scrollBy({top:delta,left:0,behavior:'auto'});
}
function scheduleCellReveal(delay=320){clearTimeout(revealTimer);revealTimer=setTimeout(()=>requestAnimationFrame(revealActiveCell),delay)}
$('rows').addEventListener('focusin',e=>{
  if(!e.target.matches('input,select,textarea'))return;
  activeCell=e.target;document.body.classList.add('keyboard-open');scheduleCellReveal(360);
});
$('rows').addEventListener('focusout',()=>{setTimeout(()=>{if(!$('rows').contains(document.activeElement)){document.body.classList.remove('keyboard-open');activeCell=null;clearTimeout(revealTimer)}},250)});
if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>scheduleCellReveal(260))}
// Save each keystroke so a partially completed row is not lost.
$('rows').addEventListener('input',e=>{let el=e.target,id=Number(el.dataset.id),k=el.dataset.key;if(!id||!k)return;let r=db.rows.find(x=>x.id===id);if(!r)return;r[k]=el.value;if(k==='mobile')r.option=el.value;save()});
$('rows').addEventListener('change',e=>{let el=e.target,id=Number(el.dataset.id),k=el.dataset.key;if(!id||!k)return;let r=db.rows.find(x=>x.id===id);if(!r)return;r[k]=el.value;if(k==='mobile')r.option=el.value;save();renderSummary(filtered())});$('rows').addEventListener('click',e=>{let b=e.target.closest('[data-del]');if(b&&confirm(T[lang].deleteConfirm)){db.rows=db.rows.filter(r=>r.id!==Number(b.dataset.del));save();render()}});
// Drag a column edge to resize it; saved locally.
let drag=null;$('head').addEventListener('pointerdown',e=>{let h=e.target.closest('[data-resize]');if(!h)return;let i=Number(h.dataset.resize);drag={i,x:e.clientX,w:widths[i]};h.setPointerCapture?.(e.pointerId);e.preventDefault()});$('head').addEventListener('pointermove',e=>{if(!drag)return;let w=Math.max(55,Math.min(500,drag.w+(e.clientX-drag.x)));widths[drag.i]=w;$('cols').children[drag.i].style.width=w+'px'});$('head').addEventListener('pointerup',()=>{if(!drag)return;localStorage.setItem(WIDTHKEY,JSON.stringify(widths));drag=null});$('head').addEventListener('pointercancel',()=>{if(drag){localStorage.setItem(WIDTHKEY,JSON.stringify(widths));drag=null}});
$('backup').onclick=()=>{const payload={app:'daily-ledger',version:1,exportedAt:new Date().toISOString(),groups:db.groups,rows:db.rows,nextId:db.nextId};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='daily-ledger-backup-'+today()+'.json';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};$('allClear').onclick=()=>{let msg=lang==='bn'?'সতর্কতা: সব দিনের সব লেনদেন স্থায়ীভাবে মুছে যাবে। আগে ব্যাকআপ নিয়েছেন কি? আপনি কি নিশ্চিত?':'Warning: All transactions for every date will be permanently deleted. Have you made a backup? Are you sure?';if(!confirm(msg))return;db={groups:[],rows:[],nextId:1};dateFilter='';monthFilter='';$('dateFilter').value='';$('monthFilter').value='';save();render()};$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.groups)||!Array.isArray(x.rows))throw 0;if(confirm(T[lang].backupReplace)){db=x;db.nextId=db.nextId||Math.max(0,...db.rows.map(r=>r.id||0))+1;db.rows.forEach(r=>{if(r.mobile===undefined)r.mobile=r.option||''});save();render();alert(T[lang].restored)}}catch(_){alert(T[lang].badBackup)}e.target.value=''};async function loadExternalScript(src){return new Promise((resolve,reject)=>{if(document.querySelector('script[data-src="'+src+'"]')){resolve();return}const s=document.createElement('script');s.src=src;s.async=true;s.dataset.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
// One Print/PDF action: use the iOS/browser native print sheet and preserve the existing print layout.
$('print').onclick=()=>{document.activeElement?.blur?.();window.print()};
async function makePNG(id){
 const r=db.rows.find(x=>x.id===Number(id));if(!r)return;
 const btn=document.querySelector(`[data-png="${id}"]`);if(btn){btn.disabled=true;btn.textContent='…'}
 let host;
 try{
  await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  const logo=document.querySelector('header img')?.src||'';
  const g=db.groups.find(x=>x.date===r.date);
  const serial=g?.serial??'';
  const bn=lang==='bn';
  const money=v=>v!==''&&v!==null&&v!==undefined?fmt(Number(v)||0):'—';
  const rows=[
   [bn?'তারিখের ক্রমিক':'Date serial',serial],
   [bn?'লেনদেন নম্বর':'Transaction no.',r.txn],
   [bn?'তারিখ':'Date',r.date],
   [bn?'লেনদেনের ধরন':'Transaction type',tr(r.type)],
   [bn?'মোবাইল / অপশন নম্বর':'Mobile / option no.',r.mobile||r.option||'—'],
   [bn?'নগদ / বাকি':'Cash / credit',tr(r.status)],
   [bn?'রেফারেন্স':'Reference',r.ref||'—'],
   [bn?'নোট':'Note',r.note||'—']
  ];
  const row=(label,value)=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:15px 0;border-bottom:1px solid rgba(205,174,93,.28);font-size:19px;line-height:1.45"><span style="color:#d9d7ce;flex:1;min-width:0;text-align:left">${esc(label)}</span><strong style="color:#fff8df;flex:1;min-width:0;text-align:right;overflow-wrap:anywhere;font-weight:700">${esc(value??'—')}</strong></div>`;
  host=document.createElement('div');
  host.style.cssText='position:fixed;left:-12000px;top:0;width:900px;padding:0;background:#071d32;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#f8f0d5;';
  host.innerHTML=`<div style="padding:28px;background:#071d32"><div style="border:3px solid #c9a957;border-radius:30px;padding:28px 30px 22px;background:linear-gradient(145deg,#1b3446 0%,#263e4b 52%,#1b3343 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)">
   <div style="display:flex;align-items:center;gap:20px;padding-bottom:20px;border-bottom:2px solid #b99a53">
    <img src="${logo}" style="width:76px;height:76px;object-fit:contain;border-radius:16px;background:#fff;padding:4px;flex:none">
    <div style="flex:1"><div style="font-size:34px;font-weight:800;color:#f5e7bd;line-height:1.35">${bn?'দৈনিক লেনদেন হিসাব':'Daily Transaction Ledger'}</div><div style="font-size:16px;letter-spacing:3px;color:#cbb77e;margin-top:6px">${bn?'লেনদেনের বিবরণী':'TRANSACTION STATEMENT'}</div></div>
    <div style="width:64px;height:54px;border:1.5px solid #c9a957;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;color:#f4d98d;flex:none">#${esc(serial||r.txn)}</div>
   </div>
   <section style="padding-top:22px"><div style="font-size:25px;font-weight:800;color:#e8ca78;margin-bottom:8px">${bn?'টাকার হিসাব':'AMOUNT SUMMARY'}</div>
    ${row(bn?'টাকার পরিমাণ (QAR)':'Amount (QAR)',money(r.qar))}
    ${row(bn?'টাকার পরিমাণ (BDT)':'Amount (BDT)',money(r.bdt))}
    ${row(bn?'আদায় (QAR)':'Collected (QAR)',money(r.collected))}
   </section>
   <section style="padding-top:24px"><div style="font-size:25px;font-weight:800;color:#e8ca78;margin-bottom:8px">${bn?'লেনদেনের বিস্তারিত':'TRANSACTION DETAILS'}</div>
    ${rows.map(x=>row(x[0],x[1])).join('')}
   </section>
   <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:13px;border-top:1px solid rgba(201,169,87,.45);font-size:13px;color:#cbb77e"><span>${bn?'সংরক্ষিত হিসাবের কপি':'SAVED TRANSACTION COPY'}</span><span>${esc(r.date)} · #${esc(r.txn)}</span></div>
  </div></div>`;
  document.body.appendChild(host);await document.fonts.ready;
  const canvas=await html2canvas(host,{scale:2,backgroundColor:'#071d32',useCORS:true,logging:false});
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw new Error('PNG canvas export failed');
  const file=new File([blob],`ledger-${r.date}-txn-${r.txn}.png`,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:bn?'লেনদেনের কপি':'Transaction copy'})}
  else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000)}
 }catch(e){alert(lang==='bn'?'PNG তৈরি হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।':'Could not create PNG. Check your internet connection and try again.')}
 finally{host?.remove();if(btn){btn.disabled=false;btn.textContent='PNG'}}
}
$('rows').addEventListener('click',e=>{const b=e.target.closest('[data-png]');if(b){makePNG(b.dataset.png)}});
load();applyLanguage();
})();
